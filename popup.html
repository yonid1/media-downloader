<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מוריד מדיה</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="icons/icon48.png" alt="" width="28" height="28">
    <div class="titles">
      <h1>מוריד מדיה</h1>
      <p id="summary">מחפש קבצים…</p>
    </div>
    <button id="downloadAll" class="btn primary" disabled>הורד הכל</button>
  </header>

  <section id="yt" class="yt" hidden>
    <div id="ytCurrent" hidden>
      <div class="yt-video">
        <div class="kind yt-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></svg>
        </div>
        <div class="info">
          <div class="name" id="ytTitle"></div>
          <div class="meta" id="ytWhere">יוטיוב</div>
        </div>
      </div>
      <div class="yt-actions">
        <button id="ytVideo" class="btn primary" disabled>הורד וידאו (MP4)</button>
        <button id="ytAudio" class="btn" disabled>הורד אודיו (MP3)</button>
      </div>
      <label class="check yt-option">
        <input type="checkbox" id="ytSponsor">
        <span>לחתוך מהסרטון קטעי חסות ופרסומות של היוצר</span>
      </label>
      <div id="ytSetup" class="notice" hidden></div>
    </div>
    <div id="ytJobsWrap" hidden>
      <div class="section-label">
        <span>הורדות מיוטיוב</span>
        <button id="ytClear" class="link">נקה</button>
      </div>
      <ul id="ytJobs" class="jobs"></ul>
    </div>
  </section>

  <div id="generic">
    <nav class="filters" aria-label="סינון">
      <button data-filter="all" class="on" aria-pressed="true">הכל <span class="count"></span></button>
      <button data-filter="video" aria-pressed="false">וידאו <span class="count"></span></button>
      <button data-filter="audio" aria-pressed="false">אודיו <span class="count"></span></button>
    </nav>

    <div id="notice" class="notice" hidden>
      יש בעמוד נגן שמזרים את התוכן בחלקים (blob), ולכן אי אפשר להוריד אותו כקובץ אחד.
    </div>

    <ul id="list" class="list"></ul>

    <div id="empty" class="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
      </div>
      <p class="empty-title">עוד לא נמצאו קבצי וידאו או אודיו בעמוד הזה</p>
      <p class="empty-hint">נסו להפעיל את הסרטון או השיר — קבצים שנטענים יופיעו כאן אוטומטית.</p>
    </div>
  </div>

  <footer class="bottom">
    <div class="settings">
      <label class="check">
        <input type="checkbox" id="skipAds">
        <span>לדלג על פרסומות ביוטיוב</span>
        <span id="adCount" class="dim"></span>
      </label>
      <label class="check">
        <input type="checkbox" id="saveAs">
        <span>לבחור תיקייה בכל הורדה</span>
      </label>
    </div>
    <button id="clear" class="link">נקה רשימה</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
